<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
    <style>
        body{
            height: 700px;
            width: 750px;
            display: flex;
            justify-content: center;
        }
        .container{
            padding: 30px;
            display: flex;
            justify-content: center;
            background-color: pink;
            outline: 2px solid black;
        }
        button{
            background-color: blue;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
    <form class="form">
    <h1>Student Login Page</h1>
    <label for="rollno">Roll No :</label>
    <input type="text" name="roll no" id="rollno" placeholder="Enter your roll no">
    <br>
    <br>
    <label for="student">Student Name :</label>
    <input type="name" name="student" id="student" placeholder="Enter your name">
    <br>
    <br>
    <label for="dob">Date of Birth :</label>
    <input type="date" name="text" id="dob">
    <br>
    <br>
    <label for="fatherName">Father Name :</label>
    <input type="text" id="fatherName" placeholder="Enter your father name">
    <br>
    <br>
    <label for="mobilNo">Mobile No :</label>
     <select id="mobilNo">
        <option value="+91">+91</option>
        <option value="+92">+92</option>
        <option value="+93">+93</option>
        <option value="+94">+94</option>
    </select>
    <input type="mobile" name="mobile" id="mobilNo">
    <br>
    <br>
    <label for="email id">Email Id :</label>
    <input type="email" name="email" id="email">
    <br>
    <br>
    <label for="password">password :</label>
    <input type="password" name="password" id="password">
    <br>
    <br>
    <label for="gender">Gender :</label>
    <input type="radio" name="gender" id="gender">Male
    <input type="radio" name="gender" id="gender">Female
    <input type="radio" name="gender" id="gender">Other
    <br>
    <br>
    <label for="department">department :</label>
    <label>
    <input type="checkbox" id="department">CSE
    </label>
    <label>
    <input type="checkbox" id="department">BCA
    </label>
    <label>
    <input type="checkbox" id="department">MCA
    </label>
    <br>
    <br>
    <label for="course">Course :</label>
    <select id="course"  placeholder="-----choose current course-----">
        <option value="CSE">CSE</option>
        <option value="BSC">BSC</option>
        <option value="MSC">MSC</option>
        <option value="B.Tech">B.Tech</option>
    </select>
    <br>
    <br>
    <label for="studentPhoto">Student Photo :</label>
    <input type="file" name="file" id="studentPhoto">
    <br>
    <br>
    <label for="city">City :</label>
    <input type="city" name="city" id="city">
    <br>
    <br>
    <label for="addresh">Addresh :</label>
    <textarea name="addresh" id="addresh" rows="3"></textarea>
    <br>
    <br>
    <button>Resister</button>
    <button type="reset">reset</button>
    </form>
    </div>

</body>
</html>
