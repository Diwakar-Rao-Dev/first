<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            text-align: center;
        }

        .container video {
            position: absolute;
            height: 100%;
            width: 100%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: -1;
        }

        .content {
            position: absolute;
            text-align: center;
            z-index: 1;
        }

        header {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: rgb(34, 32, 32);
            border-radius: 20px;
            padding: 10px;
            font-size: 15px;
            border-radius: 20px;
        }

        .content .navbar .list-item {
            list-style: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        li {
            background-color: maroon;
            padding: 5px 15px;
            border-radius: 15px;
        }

        a {
            text-decoration: none;
            color: white;
        }

        .logo h1{
            color: white;
            background-color: seagreen;
            border-color: white;
            border-radius: 25px;
            padding: 8px 15px;
        }

        button {
            background-color: blue;
            padding: 5px 10px;
            border-radius: 25px;
            border-color: white;
            font-size: 10px;
        }

        h2 {
            color: salmon;
        }
    </style>
</head>

<body>
    <div class="container">
        <video autoplay loop muted>
            <source src="../video/video3.mp4">
        </video>
        <div class="content">
            <header>
                <div class="logo">
                    <h1>🐍logo</h1>
                </div>
                <nav class="navbar">
                    <ul class="list-item">
                        <li><a href="./home.html">Home</a></li>
                        <li><a href="./about.html">About</a></li>
                        <li><a href="./service.html">Service</a></li>
                        <li><a href="./contect">Contect</a></li>
                    </ul>
                </nav>
                <button><a href="mailto: example@gmail.com">Email contect</a></button>
            </header>
            <br>
            <br>
            <br>
            <h2>Lorem ipsum dolor sit amet consectetur adipisicing elit. Dicta excepturi rem, illum, voluptatem soluta
                impedit culpa odio ipsa mollitia totam expedita quibusdam ducimus rerum eveniet sint recusandae,
                similique nemo et.
            </h2>
        </div>
    </div>
</body>

</html>
