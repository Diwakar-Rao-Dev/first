<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            padding: 20%;
            display: flex;
            justify-content: center;
            text-align: center;
        }

        .container video {
            position: absolute;
            height: 100%;
            width: 100%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: -1;
        }

        .text {
            position: absolute;
            text-align: center;
            z-index: 1;
        }

        .text h1 {
            padding: 10px;
            background-color: aqua;
            padding: 0;
            font-size: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <video autoplay loop muted>
            <source src="../video/video3.mp4">
        </video>
        <div class="text">
            <h1>heading</h1>
            <p>Lorem ipsum, dolor sit amet consectetur Consectetur.</p>
        </div>
    </div>
</body>

</html>
