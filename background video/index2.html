<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            position: relative;
            width: 100;
            height: 100vh;
            padding-top: 20%;
            display: flex;
            justify-content: center;
            text-align: center;
           

        }
        .container video{
            position: absolute;
            height: 100%;
            width: 100%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: -1;
        }
        .content{
            position: absolute;
            text-align: center;
            z-index: 1;
        }
        .content h1{
            color: rgb(241, 75, 75);
            background-color: rgb(49, 43, 43);
            padding: 0;
            border-radius: 10px;
            font-size: 50px;
        }
        .content p{
            color: rgb(2, 255, 128);
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <video src="../video/video2.mp4" autoplay loop muted></video>

        <div class="content">
            <h1>Beauti of Nature</h1><br>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Repellat, corrupti!</p>
        </div>
    </div>
</body>
</html>
