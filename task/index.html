<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: start;
            padding: 20px;
        }

        .container video {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 50%;
            left: 50%;
            object-fit: cover;
            transform: translate(-50%, -50%);
            z-index: -1;
        }
        .list-item{
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 30px;
        }
        a{
            text-decoration: none;
            color: white;
            background-color: rgba(172, 182, 192, 0.692);
            padding: 10px 20px;
            border-radius: 15px;
            font-weight: 500;
        }
        a:hover{
            background-color: seagreen;
            color: sandybrown;
        }
        .data{
            position: absolute;
            display: flex;
                
            height: 350px;
            width: 300px;
            padding: 50px;
            border: 2px solid white;
            align-items: center;
            text-align: center;
            padding-top: 50px;
        }
        input{
            height: 28px;
            width: 200px;
        }
    </style>
</head>

<body>
    <div class="container">
        <video autoplay loop muted>
            <source src="../video/video.mp4">
        </video>
        <div class="content">
            <header>
                <nav>
                    <ul class="list-item">
                        <li><a href="#">Home</a></li>
                        <li><a href="#">Feature</a></li>
                        <li><a href="#">Product</a></li>
                        <li><a href="#">Store</a></li>
                        <li><a href="#">Gallary</a></li>
                    </ul>
                </nav>
            </header>
            <div class="data">
                <form>
                <input type="text" name="text" placeholder="enter your name" pattern="absolute">
                <br>
                <br>
                <input type="dob" name="dob" placeholder="enter your dob">
                <br>
                <br>
                <input type="password" name="password" placeholder="enter password">
                <br>
                <br>
                <input type="checkbox" name="checkbox" id="checkbox">agree terms & condition
                <br>
                <br>
                <button type="submit">submit</button>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
