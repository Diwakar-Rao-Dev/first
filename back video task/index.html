<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container video{
            position: absolute;
            width: 100%;
            height: 100%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: -1;
        }
        .content{
            position: absolute;
            text-align: center;
            z-index: 1;
        }
        .content form{
            border: 2px solid black;
            border-radius: 10px;
            padding: 50px;
            background-color: rgba(165, 42, 42, 0.425);
            color: rgba(255, 255, 255, 0.822);
        }
        .btn{
            background-color: rgba(0, 0, 255, 0.411);
            color: rgba(255, 0, 0, 0.712);
            border-radius: 10px;
            padding: 5px 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <video autoplay loop muted>
            <source src="../video/sample-5.mp4">
        </video>
        <div class="content">
            <form>
                <label for="name">Name :</label>
                <input type="text" name="name" id="name" minlength="5" maxlength="8" required>
                <br>
                <br>
                <label for="rollNo">Roll No :</label>
                <input type="rollno" name="rollno" required>
                <br>
                <br>
                <label for="password">Password :</label>
                <input type="password" name="password" id="password" minlength="4" maxlength="8" required>
                <br>
                <br>
                
                <hr>
                <br>
                <button class="btn">Ragister</button>
            </form>
        </div>
    </div>
</body>
</html>
