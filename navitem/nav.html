<!DOCTYPE html>

<head>

    <title>Navbar with logo</title>
    <style>
        *{
         margin: 0px;
         padding: 0px;
         box-sizing: border-box;   
        }
       header{
        display: flex;
        justify-content: space-around;
        background-color: rgb(211, 139, 88);
        text-transform: uppercase;
        padding: 10px;
        align-items: center;
        font-size: 20px;
       }
       ul{
        display: flex;
        gap: 24px;
        list-style: none;
       }
       a{
        text-decoration: none;
        color: aliceblue;
       }
       a:hover{
        background-color: rgb(70, 70, 179);
        border-radius: 10px;
        padding: 5px;
       }
       button{
        background-color: rgb(185, 164, 164);
        padding: 8px;
        border: none;
        border-radius: 5px;
       }
    </style>
</head>
<body>
    <header>

        </div>
        <nav>

</html>
