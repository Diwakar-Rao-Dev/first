<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            display: flex;
            justify-content: space-evenly;
            gap: 20px;
            padding: 20px;
        }
        .box1{
            height: 150px;
            width: 150px;
            background-color: salmon;
            border-radius: 10px;
            animation: moveBox1 9s infinite;
        }
         @keyframes moveBox1 {
            from {
                transition: translateY(0);
            }
            to {
                transform: translateY(450px);
            }
        }
        .box2{
            height: 150px;
            width: 150px;
            margin-top: 46%;
            background-color: slateblue;
            border-radius: 10px;
            animation: moveBox2 9s infinite;
        }
         @keyframes moveBox2 {
            from {
                transition: translateY(0);
            }
            to {
                transform: translateY(-450px);
            }
        }
        .box3{
            height: 150px;
            width: 150px;
            background-color: seagreen;
            border-radius: 10px;
            animation: moveBox3 9s infinite;
        }
        @keyframes moveBox3 {
            from {
                transition: translateY(0);
            }
            to {
                transform: translateY(500px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
    </div>
</body>
</html>
