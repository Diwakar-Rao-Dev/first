<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        nav{
            background-color: aquamarine;
            display: flex;
            justify-content: center;
        }
        ul li{
            list-style: none;
            display: inline-block;
            position: relative;
        }
        ul li a{
            text-decoration: none;
            color: tomato;
            padding: 10px 20px;
            display: block;
        }
        ul li:hover{
             background: #555;
        }
        .dropdown{
            display: none;
            position: absolute;
            background-color: #222;
            list-style: none;
            width: 150px;
        }
        ul li:hover .dropdown{
            display: block;
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="">Diwakar</a>
            <ul class="dropdown">
                <li><a href="">Rudreshawer</a></li>
                <li><a href="">Beta</a></li>
                <li><a href="">Hmar</a></li>
            </ul>
            </li>
            <li><a href="">Aman</a></li>
            <li><a href="">Irafan</a></li>
        </ul>
    </nav>
</body>
</html>
