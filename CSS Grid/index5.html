<html lang="en">
<head>

    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    .container{
        display: grid;
        height: 100dvh;
        width: 100dvw;
        border: 2px solid red;
        grid-template-columns: repeat(auto-fit, 
        minmax(200px, 1fr)
        );
        gap: 20px;
        padding: 15px;
    }
    .box{
        background-color: blue;
        min-height: 200px;
        min-width: 150px;
    }
    </style>
</head>

        <div class="box"><img src="../photo/photo3.jpg" alt="photos"></div>

        <div class="box"><img src="../photo/photo5.jpg" alt="photos"></div>
        <div class="box"><img src="../photo/photo6.jpg" alt="photos"></div>

</html>
