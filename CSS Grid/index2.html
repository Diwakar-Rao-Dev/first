<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: 200px, 200px; 
            grid-template-rows: 100px, 200px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .box{
            height: 300px;
            width: 300px;
            background-color: cadetblue;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"><img src="../photo/photo1.jpg" alt="animal" height="300px" width="300px"></div>
        <div class="box"><img src="../photo/photo7.jpg" alt="nature" height="300px" width="300px"></div>
        <div class="box"><img src="../photo/photo3.jpg" alt="flawer" height="300px" width="300px"></div>
        <div class="box"><img src="../photo/photo6.jpg" alt="parrot" height="300px" width="300px"></div>
    </div>
</body>
</html>
